[package]
name = "visualize-to-graph-in-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Wrikka"]
description = "สร้าง web graph visualizer ด้วย Rust CLI และ Solid frontend จาก JSON nodes/edges"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
fastrand = "2"

[profile.release]
opt-level = 3
lto = true
