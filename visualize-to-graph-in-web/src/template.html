<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Visualizer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111827;
      color: #f9fafb;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    circle {
      cursor: pointer;
      stroke: #ffffff;
      stroke-width: 1.5;
    }
    line {
      stroke: #6b7280;
      stroke-width: 1.5;
    }
    text {
      fill: #f9fafb;
      font-size: 12px;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid #374151;
      pointer-events: none;
      min-width: 160px;
      line-height: 1.5;
    }
    .muted {
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="info"></div>
  </div>
  <script type="module">
    import { createRoot, createSignal, createEffect } from 'https://esm.sh/solid-js@1.9.0';

    createRoot(() => {
      const graphData = __GRAPH_DATA__;
      const nodesById = Object.fromEntries(graphData.nodes.map(n => [n.id, n]));
      const svgNS = 'http://www.w3.org/2000/svg';

      const [selected, setSelected] = createSignal(null);
      const [hover, setHover] = createSignal(null);
      const [scale, setScale] = createSignal(1);
      const [offset, setOffset] = createSignal({ x: 0, y: 0 });

      const palette = ['#60a5fa', '#34d399', '#f472b6', '#fbbf24', '#a78bfa', '#22d3ee', '#fb7185', '#a3e635'];

      function colorFor(group) {
        const g = group || '';
        let hash = 0;
        for (let i = 0; i < g.length; i++) {
          hash = ((hash << 5) - hash) + g.charCodeAt(i);
        }
        return palette[Math.abs(hash) % palette.length];
      }

      const app = document.getElementById('app');
      const info = document.getElementById('info');
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 1000 800');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      app.appendChild(svg);

      const edgesG = document.createElementNS(svgNS, 'g');
      const nodesG = document.createElementNS(svgNS, 'g');
      svg.appendChild(edgesG);
      svg.appendChild(nodesG);

      graphData.edges.forEach(edge => {
        const from = nodesById[edge.from];
        const to = nodesById[edge.to];
        if (!from || !to) return;
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
        edgesG.appendChild(line);
      });

      graphData.nodes.forEach(node => {
        const g = document.createElementNS(svgNS, 'g');

        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', node.x);
        circle.setAttribute('cy', node.y);
        circle.setAttribute('r', 6);
        circle.setAttribute('fill', colorFor(node.group));
        g.appendChild(circle);

        const label = node.label || node.id;
        const text = document.createElementNS(svgNS, 'text');
        text.setAttribute('x', node.x + 10);
        text.setAttribute('y', node.y + 4);
        text.textContent = label;
        g.appendChild(text);

        g.addEventListener('click', (e) => {
          e.stopPropagation();
          setSelected(node.id);
        });
        g.addEventListener('mouseenter', () => setHover(node.id));
        g.addEventListener('mouseleave', () => setHover(null));

        nodesG.appendChild(g);
      });

      let isPanning = false;
      let lastX = 0;
      let lastY = 0;

      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY * -0.001;
        setScale(s => Math.max(0.2, Math.min(5, s * (1 + delta))));
      }, { passive: false });

      svg.addEventListener('mousedown', (e) => {
        isPanning = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });

      window.addEventListener('mouseup', () => isPanning = false);

      svg.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        const o = offset();
        setOffset({ x: o.x + e.clientX - lastX, y: o.y + e.clientY - lastY });
        lastX = e.clientX;
        lastY = e.clientY;
      });

      svg.addEventListener('click', () => setSelected(null));

      createEffect(() => {
        const s = scale();
        const o = offset();
        const t = `translate(${o.x} ${o.y}) scale(${s})`;
        edgesG.setAttribute('transform', t);
        nodesG.setAttribute('transform', t);
      });

      createEffect(() => {
        const id = hover() || selected();
        const node = id ? nodesById[id] : null;
        if (node) {
          info.innerHTML = `<strong>${node.label || node.id}</strong><br><span class="muted">group:</span> ${node.group || '-'}<br><span class="muted">id:</span> ${node.id}`;
        } else {
          info.innerHTML = `<span class="muted">nodes:</span> ${graphData.nodes.length}<br><span class="muted">edges:</span> ${graphData.edges.length}`;
        }
      });
    });
  </script>
</body>
</html>
