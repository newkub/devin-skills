name: Agents Task
description: Create a task for an AI agent or assistant to execute
title: "[Agent]: "
labels: ["agents-task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to assign a task to an AI agent. Be specific about the goal, context, and expected output.
  - type: textarea
    id: task
    attributes:
      label: Task Description
      description: What should the agent do?
      placeholder: Describe the task clearly and concisely
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is the intended outcome?
      placeholder: Describe the goal of this task
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide relevant context, links, files, or previous work
      placeholder: |
        - Related issue: #...
        - Relevant file: `path/to/file.ts`
        - Previous attempt: #...
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tools and Constraints
      description: Which tools or commands may the agent use? Any constraints?
      placeholder: |
        - Allowed: `grep`, `edit`, `exec`
        - Constraints: do not modify `AGENTS.md`
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know the task is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected Output
      description: What should the agent deliver? (report, file, command output, etc.)
    validations:
      required: true
